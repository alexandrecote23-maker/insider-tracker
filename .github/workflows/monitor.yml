name: Insider Tracker

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 9:00 AM EDT (weekdays)
    - cron: '0 18 * * 1-5'  # 2:00 PM EDT (weekdays)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore alert cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: alert-cache-${{ github.run_id }}
          restore-keys: alert-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run insider tracker
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          TICKERS: ${{ secrets.TICKERS }}
        run: python -m src.main --once
